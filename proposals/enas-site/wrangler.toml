# Enas Latif proposal at shotbyfvm.com/enas. It is its own Worker, so deploys of the
# main site cannot remove it. Deploy from this folder with: npx wrangler deploy
name = "fvm-enas-proposal"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "shotbyfvm.com/enas*", zone_name = "shotbyfvm.com" },
  { pattern = "shotbyfvm.com/Enas*", zone_name = "shotbyfvm.com" },
  { pattern = "shotbyfvm.com/ENAS*", zone_name = "shotbyfvm.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
